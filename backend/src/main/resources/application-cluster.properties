# ===========================================
# Spring Profile: cluster
# 启用方式：在启动参数中增加 --spring.profiles.active=cluster
# 或设置环境变量 SPRING_PROFILES_ACTIVE=cluster
# ===========================================

spring.config.activate.on-profile=cluster

# -------- Hadoop 分布式配置 --------
# 可通过环境变量覆盖，默认值为示例地址，请替换为实际集群信息
hadoop.fs.defaultFS=${HDFS_URI:hdfs://namenode:8020}
hadoop.mapreduce.framework.name=yarn
hadoop.data.dir=/var/bigdata/hadoop
hadoop.yarn.resourcemanager.address=${YARN_RM_ADDRESS:rm-host:8032}
hadoop.yarn.resourcemanager.scheduler.address=${YARN_RM_SCHEDULER:rm-host:8030}
hadoop.mapreduce.jobhistory.address=${MR_JOB_HISTORY:history-host:10020}
# Yarn/MapReduce classpath 可根据发行版调整
hadoop.mapreduce.application.classpath=${MR_APP_CLASSPATH:/opt/hadoop/share/hadoop/mapreduce/*:/opt/hadoop/share/hadoop/mapreduce/lib/*}
yarn.application.classpath=${YARN_APP_CLASSPATH:/opt/hadoop/etc/hadoop:/opt/hadoop/share/hadoop/common/*:/opt/hadoop/share/hadoop/common/lib/*:
  /opt/hadoop/share/hadoop/hdfs/*:/opt/hadoop/share/hadoop/hdfs/lib/*:/opt/hadoop/share/hadoop/yarn/*:/opt/hadoop/share/hadoop/yarn/lib/*:
  /opt/hadoop/share/hadoop/mapreduce/*:/opt/hadoop/share/hadoop/mapreduce/lib/*}

# -------- Spark 分布式配置 --------
spark.app.name=PropertyRecommendation
spark.master=${SPARK_MASTER:yarn}
spark.submit.deployMode=${SPARK_DEPLOY_MODE:cluster}
spark.driver.memory=4g
spark.executor.memory=4g
spark.sql.shuffle.partitions=200
spark.ui.enabled=true
spark.yarn.queue=${SPARK_YARN_QUEUE:default}
# 让 Spark 使用同一套 HDFS 配置
spark.hadoop.fs.defaultFS=${HDFS_URI:hdfs://namenode:8020}
spark.hadoop.resource.manager.address=${YARN_RM_ADDRESS:rm-host:8032}
spark.hadoop.resource.manager.scheduler.address=${YARN_RM_SCHEDULER:rm-host:8030}
spark.hadoop.history.server.address=${SPARK_HISTORY_DIR:hdfs://namenode:8020/spark-history}
