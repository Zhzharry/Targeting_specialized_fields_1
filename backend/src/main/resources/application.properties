# ===========================================
# 应用基础配置（默认本地模式）
# 如需分布式执行，请在启动时指定 spring.profiles.active=cluster
# ===========================================
server.port=5000
spring.application.name=springboot-vue-demo

# ===========================================
# 数据库配置 - MySQL 8（使用bigdata数据库）
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/bigdata?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=bigdata_user
spring.datasource.password=123456

# 数据库连接池配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===========================================
# JPA配置 - MySQL
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 关闭H2控制台（因为现在使用MySQL）
spring.h2.console.enabled=false

# ===========================================
# Hadoop 配置
# ===========================================
# 本地模式（开发环境）
hadoop.fs.defaultFS=file:///

# HDFS模式（生产环境，取消注释并配置）
# hadoop.fs.defaultFS=hdfs://your-namenode:9000
hadoop.hdfs.uri=hdfs://localhost:9000
hadoop.tmp.dir=/tmp/hadoop-property-similarity

# MapReduce框架
# local = 本地模式（开发）
# yarn = YARN模式（生产）
hadoop.mapreduce.framework.name=local

# Hadoop数据目录
hadoop.data.dir=/tmp/hadoop-recommendation-data

# ===========================================
# Spark 配置（本地模式）
# ===========================================
spark.app.name=PropertyRecommendation
spark.master=local[*]
spark.driver.memory=4g
spark.executor.memory=4g
spark.sql.shuffle.partitions=10
spark.ui.enabled=false

# ===========================================
# 房源相似度计算配置
# ===========================================
# 是否在启动时自动执行相似度计算（建议false，通过API或定时任务触发）
similarity.calculation.on-startup=false

# 聚类参数
similarity.clustering.k=8
similarity.clustering.max-iterations=100

# 相似度阈值（低于此值的不保存）
similarity.threshold=0.3

# 批量处理大小
similarity.batch-size=1000

# ===========================================
# 推荐系统配置
# ===========================================
# 用户相似度最小阈值
recommendation.similarity.min.threshold=0.3

# 推荐结果数量
recommendation.topk=10

# 缓存过期时间（毫秒）
recommendation.cache.expiry=3600000

# ===========================================
# 房价预测模型配置
# ===========================================
# 模型文件路径（相对于项目根目录或绝对路径）
predictor.model-base-dir=src/main/java/com/example/service/predict_zhz
predictor.python-exec=python

# ===========================================
# 定时任务配置
# ===========================================
# 启用定时任务
spring.task.scheduling.enabled=true

# 异步任务配置
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# ===========================================
# 日志配置
# ===========================================
logging.level.com.example=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Spark和Hadoop日志级别（减少输出）
logging.level.org.apache.spark=WARN
logging.level.org.apache.hadoop=WARN
logging.level.org.spark_project=WARN

# ===========================================
# 服务器配置
# ===========================================
server.tomcat.connection-timeout=20000
spring.mvc.async.request-timeout=30000



# ===========================================
# 【追加到 application.properties 末尾】
# 用户相似度配置（新增）
# ===========================================

# 用户相似度传递阈值（参与传递计算的最小相似度）
similarity.user.propagation.threshold=0.3

# 增量计算触发阈值（浏览多少次后触发增量计算）
similarity.user.incremental.threshold=10

# 用户相似度最小阈值
similarity.user.min.threshold=0.1

# 传递计算最大中间用户数
similarity.user.max.intermediate=20