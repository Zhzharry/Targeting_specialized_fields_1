# 应用配置
server.port=5000
spring.application.name=springboot-vue-demo

# 数据库配置 - MySQL 8（使用bigdata数据库）
spring.datasource.url=jdbc:mysql://localhost:3306/bigdata?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=bigdata_user
spring.datasource.password=123456

# 数据库连接池配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA配置 - MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 关闭H2控制台（因为现在使用MySQL）
spring.h2.console.enabled=false

# 跨域配置 - 注意：Spring Boot 2.x需要通过Java配置类实现CORS
# 请参考config包中的CorsConfig类（如果存在）
# 或者在Controller中使用@CrossOrigin注解

# 日志配置
logging.level.com.example=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# 服务器超时配置
server.tomcat.connection-timeout=20000
spring.mvc.async.request-timeout=30000

# 房价预测模型配置
# 模型文件路径（相对于项目根目录或绝对路径）
predictor.model-base-dir=src/main/java/com/example/service/predict_zhz
predictor.python-exec=python





# Hadoop 文件系统配置
# 本地模式（开发环境）
hadoop.fs.defaultFS=file:///

# HDFS模式（生产环境，取消注释并配置）
# hadoop.fs.defaultFS=hdfs://your-namenode:9000

# MapReduce框架
# local = 本地模式（开发）
# yarn = YARN模式（生产）
hadoop.mapreduce.framework.name=local

# Hadoop数据目录
hadoop.data.dir=/tmp/hadoop-recommendation-data

# ===========================================
# 推荐系统配置
# ===========================================

# 用户相似度最小阈值
recommendation.similarity.min.threshold=0.3

# 推荐结果数量
recommendation.topk=10

# 缓存过期时间（毫秒）
recommendation.cache.expiry=3600000

# ===========================================
# 定时任务配置
# ===========================================

# 启用定时任务
spring.task.scheduling.enabled=true

# 异步任务配置
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100